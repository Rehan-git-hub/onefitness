<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  /* Rounded, friendly font closer to the iPad screenshot look */
  @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap');

  /* ---- Color theme — change these two variables whenever you decide on a color ---- */
  :root {
    --card-bg: rgba(20, 20, 20, 0.45);
    --card-border: rgba(255, 255, 255, 0.12);
    --text-color: #f5f5f5;
    --accent-color: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
  }

  .card {
    width: 100%;
    height: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--text-color);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  .date {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    opacity: 0.75;
    text-transform: uppercase;
  }

  .time {
    font-size: 76px;
    font-weight: 700;
    line-height: 1;
    margin-top: 10px;
    color: var(--accent-color);
    letter-spacing: -1px;
  }

  .time .ampm {
    font-size: 22px;
    font-weight: 600;
    opacity: 0.6;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- <div class="date" id="date"></div> -->
    <div class="time" id="time"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();

    //   const dayName = now.toLocaleDateString('en-US', { weekday: 'long' });
    //   const monthName = now.toLocaleDateString('en-US', { month: 'long' });
    //   const dayNum = now.getDate();
    //   document.getElementById('date').textContent = `${dayName}, ${monthName} ${dayNum}`;

      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours === 0 ? 12 : hours;

      document.getElementById('time').innerHTML =
        `${hours}:${minutes}<span class="ampm">${ampm}</span>`;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
